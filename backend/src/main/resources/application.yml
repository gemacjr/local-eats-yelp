server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: yelp-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/yelp}
    username: ${DB_USERNAME:yelp}
    password: ${DB_PASSWORD:yelp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    # HS256 needs >= 32 bytes. Override in every non-local environment.
    secret: ${JWT_SECRET:local-dev-secret-change-me-at-least-32-bytes!!}
    ttl-hours: ${JWT_TTL_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  s3:
    bucket: ${S3_BUCKET:yelp-photos}
    region: ${AWS_REGION:us-east-1}
    # Set only for LocalStack. Leave empty on AWS so the SDK uses the real S3 endpoint.
    endpoint: ${S3_ENDPOINT:}
    # Endpoint used inside presigned URLs (what the *browser* can reach). Defaults to endpoint.
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    presign-minutes: 15
  search:
    default-radius-meters: 5000
    max-radius-meters: 50000
    max-page-size: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
