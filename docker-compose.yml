name: yelp

services:
  postgres:
    # Multi-arch PostGIS build (the official postgis/postgis image has no arm64 variant).
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_DB: yelp
      POSTGRES_USER: yelp
      POSTGRES_PASSWORD: yelp
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yelp -d yelp"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: yelp-photos
      # Newer LocalStack images require a (free) auth token; harmless if unset for older tags.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "${LOCALSTACK_HOST_PORT:-4568}:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket yelp-photos"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/yelp
      DB_USERNAME: yelp
      DB_PASSWORD: yelp
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes!!}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: yelp-photos
      # Container-to-container endpoint for API calls...
      S3_ENDPOINT: http://localstack:4566
      # ...but presigned URLs must be reachable from the user's browser.
      S3_PUBLIC_ENDPOINT: http://localhost:${LOCALSTACK_HOST_PORT:-4568}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  pgdata:
